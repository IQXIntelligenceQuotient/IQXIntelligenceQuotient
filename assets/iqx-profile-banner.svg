    <rect x="16" y="15" width="358" height="300" rx="18" fill="#12233a" stroke="#476687"/>
    <rect width="358" height="300" rx="18" fill="url(#panel)" stroke="#597797"/>
    <path d="M0 47H358" stroke="#46627e"/>
    <g fill="#92adc8"><circle cx="23" cy="24" r="4"/><circle cx="39" cy="24" r="4"/><circle cx="55" cy="24" r="4"/></g>
    <rect x="102" y="15" width="155" height="18" rx="9" fill="#101f32"/>
    <text x="179" y="28" text-anchor="middle" fill="#c1d7ed" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1">iqx.world</text>
    <rect x="24" y="72" width="310" height="91" rx="10" fill="#dcecff"/>
    <path d="M45 135L64 106L82 123L107 94M95 94H107V106" fill="none" stroke="#315f8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="19" fill="#18334e"><text x="130" y="110">Designed for people.</text><text x="130" y="140">Built for the web.</text></g>
    <rect x="24" y="181" width="145" height="94" rx="10" fill="#0d1b2d" stroke="#3d5976"/>
    <path d="M47 205L39 213L47 221M70 205L78 213L70 221M62 200L54 226" fill="none" stroke="#a7cffa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="39" y="254" fill="#d5e5f7" font-family="Segoe UI, Arial, sans-serif" font-size="15">Readable HTML</text>
    <rect x="187" y="181" width="147" height="94" rx="10" fill="#0d1b2d" stroke="#3d5976"/>
    <circle cx="215" cy="212" r="10" fill="none" stroke="#a7cffa" stroke-width="2.5"/>
    <path d="M222 220L231 229" stroke="#a7cffa" stroke-width="2.5" stroke-linecap="round"/>
