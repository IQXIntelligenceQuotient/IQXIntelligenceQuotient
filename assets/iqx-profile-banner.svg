<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">IQX Solutions — Ideas, built to work.</title>
  <desc id="description">A navy and ice-blue banner for IQX Solutions with an abstract browser illustration. Websites, search and digital experiences, delivered from Lahore.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101e34"/><stop offset="1" stop-color="#070e1b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3569a4" stop-opacity=".42"/><stop offset="1" stop-color="#3569a4" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#213c5b"/><stop offset="1" stop-color="#14253a"/></linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9edff"/><stop offset="1" stop-color="#8bbbed"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b6d7fa" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#background)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <ellipse cx="1020" cy="220" rx="420" ry="340" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="479" rx="23.5" fill="none" stroke="#a2c3e8" stroke-opacity=".17"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="62" y="100" fill="#f3f8ff" font-size="62" font-weight="750" letter-spacing="-3">IQX<tspan fill="#8bbbed">.</tspan></text>
    <path d="M233 55V101" stroke="#4b647f"/>
    <text x="256" y="73" fill="#d5e5f7" font-size="18" font-weight="600" letter-spacing="2.5">INTELLIGENCE</text>
    <text x="256" y="98" fill="#d5e5f7" font-size="18" font-weight="600" letter-spacing="2.5">QUOTIENT</text>
    <text x="62" y="218" fill="#f3f8ff" font-size="64" font-weight="650" letter-spacing="-2.6">Ideas, built</text>
    <text x="62" y="289" fill="url(#highlight)" font-size="64" font-weight="650" letter-spacing="-2.6">to work.</text>
    <text x="65" y="342" fill="#b4c9df" font-size="21">Websites. Search. Digital experiences.</text>
    <path d="M64 388H670" stroke="#324862"/>
    <text x="64" y="429" fill="#b4c9df" font-size="18">Lahore, Pakistan · Working remotely with UK businesses</text>
  </g>
  <g transform="translate(770 67)">
